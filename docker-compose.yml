version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: streamyard-postgres
    restart: always
    environment:
      POSTGRES_USER: streamyard
      POSTGRES_PASSWORD: streamyard_password
      POSTGRES_DB: streamyard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - streamyard-network

  # Optional: pgAdmin for database management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: streamyard-pgadmin
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@streamyard.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - streamyard-network

volumes:
  postgres_data:

networks:
  streamyard-network:
    driver: bridge
